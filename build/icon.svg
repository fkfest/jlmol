<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Benzene ring (hexagon) -->
  <polygon points="50,18 77,32 77,62 50,76 23,62 23,32" fill="none" stroke="#22223B" stroke-width="4"/>
  <!-- Julia colors for C atoms: green (top), purple (bottom right), red (bottom left), blue (very bottom and others) -->
  <circle cx="50" cy="18" r="9" fill="#389826"/> <!-- green (top) -->
  <circle cx="77" cy="32" r="9" fill="#3887B8"/> <!-- blue -->
  <circle cx="77" cy="62" r="9" fill="#9558B2"/> <!-- purple (bottom right) -->
  <circle cx="50" cy="76" r="9" fill="#3887B8"/> <!-- blue (very bottom) -->
  <circle cx="23" cy="62" r="9" fill="#D7263D"/> <!-- red (bottom left) -->
  <circle cx="23" cy="32" r="9" fill="#3887B8"/> <!-- blue -->
</svg>
