# Boot-and-init gate: the app must start, the JSmol applet must reach _ready,
# and no renderer console line may carry an error signature. This is what
# makes dependency bumps (electron majors included) checkable in a repo
# without a UI test suite.
name: smoke
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # pinned to match release.yml -- one toolchain across workflows
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: smoke test
        run: xvfb-run -a npx electron . --smoke --disable-gpu --no-sandbox
        timeout-minutes: 3
      - name: bridge probe
        run: xvfb-run -a npx electron . --bridge-probe --disable-gpu --no-sandbox
        timeout-minutes: 3
      # The same two gates against a packaged build. The source-tree runs above
      # cannot see packaging mistakes: v1.5.2-v1.5.4 shipped without preload.js
      # (the whole native bridge silently fell back to browser mode) and the
      # packaged Linux app loaded its own executable as a molecule at startup.
      - name: package (linux dir)
        run: npx electron-builder --linux dir --publish never
        timeout-minutes: 10
      - name: packaged smoke test
        run: xvfb-run -a dist/linux-unpacked/jlmol --smoke --disable-gpu --no-sandbox
        timeout-minutes: 3
      - name: packaged bridge probe
        run: xvfb-run -a dist/linux-unpacked/jlmol --bridge-probe --disable-gpu --no-sandbox
        timeout-minutes: 3
