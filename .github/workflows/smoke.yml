# Boot-and-init gate: the app must start, the JSmol applet must reach _ready,
# and no renderer console line may carry an error signature. This is what
# makes dependency bumps (electron majors included) checkable in a repo
# without a UI test suite.
name: smoke
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # pinned to match release.yml -- one toolchain across workflows
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: smoke test
        run: xvfb-run -a npx electron . --smoke --disable-gpu --no-sandbox
        timeout-minutes: 3
