# Weekly dependency PRs: future electron (and transitive) patches arrive as
# pull requests instead of security-alert emails.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Electron majors are taken deliberately (a few times a year), through
      # the smoke gate -- not on the weekly schedule. Security alerts are NOT
      # silenced by this ignore.
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
